[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookshelf"
version = "0.1.0"
description = "A small bookshelf REST API, used in the Chainguard Learning Lab on secure-by-default agent workflows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "build",
    "hypothesis",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookshelf = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["bookshelf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that exercise the HTTP API end to end",
    "property: property-based tests (Hypothesis)",
]
